<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover is required, not cosmetic: without it every
      env(safe-area-inset-*) in core.css resolves to zero, and controls end up
      under the notch and the gesture bar.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Solid Kit App</title>
    <!--
      The stored theme, stamped before first paint (see src/ui/theme.ts). It
      cannot wait for the module script: a dark choice would flash light on
      every load. Keep the key and the choices in step with theme.ts — its
      test reads this file to check.
    -->
    <script>
      try {
        var t = localStorage.getItem("solid-kit:theme");
        if (t === "light" || t === "dark" || t === "contrast")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
